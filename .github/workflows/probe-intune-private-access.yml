name: Probe private Intune relay access

on:
  push:
    paths:
      - '.github/workflows/probe-intune-private-access.yml'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RELAY_TOKEN: ${{ secrets.APT_REPOSITORY_DISPATCH_TOKEN }}
    steps:
      - name: Verify token can read private Intune release and reach central repository
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RELAY_TOKEN:-}"
          GH_TOKEN="$RELAY_TOKEN" gh api repos/Infiltrator-Projects/Intune-Zabbix-Bridge/releases/latest --jq '.tag_name' | grep -Eq '^v[0-9]'
          GH_TOKEN="$RELAY_TOKEN" gh api repos/Infiltrator-Projects/Infiltrator-Repository --jq '.full_name' | grep -Fxq 'Infiltrator-Projects/Infiltrator-Repository'
          echo 'Existing APT token can relay private Intune releases.'
