name: Test and package

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y jq php-cli

      - name: Run project tests
        run: ./tools/test.sh

      - name: Build portable installer
        run: ./tools/build-installer.sh

      - name: Build Debian package
        run: ./tools/build-deb.sh

      - name: Inspect Debian package
        run: dpkg-deb --info dist/nps-wheres-wally-zabbix_1.1.5_all.deb
